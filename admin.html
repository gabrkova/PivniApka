<!DOCTYPE html>
<html lang="cs">
<!--
================================================================
PIVNÍ POČÍTADLO — ADMIN (model s aktivní akcí)

Model dat:
  /pivo/aktivni        -> id aktivní akce (řetězec)
  /pivo/akce/<id>      -> { nazev, zalozeno, hraci:{slug:{name,count,updatedAt}}, _log:{...} }
  (staré uzly /pivo/nase-parta a /pivo/archiv zůstávají jen ke čtení kvůli importu)

Admin umí:
  • přihlášení Googlem (první admin: gabr.kova@gmail.com),
  • založit novou akci s názvem a nastavit ji jako aktuální,
  • přepnout aktuální akci na kteroukoli dřívější (návrat k předchozí akci),
  • přejmenovat akci, zobrazit (jen čtení) a exportovat CSV,
  • jednorázově importovat dosavadní data (aktuální tabuli + archiv) do nového modelu.

NASTAVENÍ (Firebase konzole, projekt pivni-pocitacka):
  1) Authentication -> Sign-in method -> Google (zapnout).
  2) Authentication -> Settings -> Authorized domains -> gabrkova.github.io.
  3) firebaseConfig už je vložen níže.
  4) Realtime Database -> Rules -> nahraď těmito a Publish:

  {
    "rules": {
      "pivo": {
        "aktivni": {
          ".read": true,
          ".write": "auth != null && auth.token.email_verified == true && auth.token.email == 'gabr.kova@gmail.com'"
        },
        "akce": {
          ".read": true,
          "$id": {
            ".write": "auth != null && auth.token.email_verified == true && auth.token.email == 'gabr.kova@gmail.com'",
            "hraci": { ".write": "$id === root.child('pivo/aktivni').val()" },
            "_log":  { ".write": "$id === root.child('pivo/aktivni').val()" }
          }
        },
        "nase-parta": { ".read": true },
        "archiv": { ".read": true }
      }
    }
  }
================================================================
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pivní počítadlo — admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --pozadi:#150e07; --pozadi2:#231508; --karta:#241808; --okraj:#3d2d14;
      --lezak:#f0a71f; --lezak-tmavy:#b97a0c; --mosaz:#6b4a09;
      --pena:#f7efdc; --kour:#a3906f; --cerv:#d0704e; --zelena:#7ea86a;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0; min-height:100vh; color:var(--pena);
      font-family:'Archivo',system-ui,sans-serif;
      background:radial-gradient(900px 520px at 50% -8%, var(--pozadi2), var(--pozadi) 62%);
      display:flex; justify-content:center; padding:24px 16px;
    }
    .obal{ width:100%; max-width:32rem; }
    .titul{ font-family:'Alfa Slab One',serif; font-size:26px; color:var(--lezak); text-align:center; text-shadow:0 2px 0 rgba(0,0,0,.45); }
    .podtitul{ color:var(--kour); font-size:13px; text-align:center; margin-top:2px; }
    .karta{ background:var(--karta); border:1px solid var(--okraj); border-radius:16px; padding:18px; margin-top:14px; }
    .kour{ color:var(--kour); } .male{ font-size:13px; }
    button{ font-family:inherit; cursor:pointer; border:none; }
    button:active{ transform:scale(.97); }
    .btn{ border-radius:12px; padding:10px 14px; font-weight:700; font-size:14px; color:#241503; background:linear-gradient(180deg, var(--lezak), var(--lezak-tmavy)); border:2px solid var(--mosaz); }
    .btn.sek{ background:transparent; color:var(--kour); border:1px solid var(--okraj); font-weight:600; }
    .btn.mini{ padding:6px 10px; font-size:12px; border-radius:10px; }
    .btn:disabled{ opacity:.45; }
    input.pole{ width:100%; border-radius:12px; padding:11px 14px; font-size:16px; background:var(--pozadi); border:1px solid var(--okraj); color:var(--pena); }
    input.pole:focus{ outline:none; border-color:var(--lezak); }
    .polozka{ padding:10px 0; border-top:1px solid rgba(255,255,255,.06); }
    .polozka:first-of-type{ border-top:none; }
    .polozka .hlava{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .nazevAkce{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .odznak{ font-size:11px; font-weight:700; color:#241503; background:var(--lezak); border-radius:999px; padding:2px 8px; margin-left:8px; }
    .tlacitka{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .radek{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-top:1px solid rgba(255,255,255,.06); }
    .radek:first-of-type{ border-top:none; }
    .jmeno-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chyba{ background:#31170e; color:var(--cerv); border:1px solid var(--cerv); border-radius:12px; padding:8px 12px; font-size:13px; text-align:center; margin-top:12px; }
    .ok{ background:#1c2416; color:var(--zelena); border:1px solid var(--zelena); border-radius:12px; padding:8px 12px; font-size:13px; text-align:center; margin-top:12px; }
    .nazevKarty{ font-weight:700; font-size:16px; margin-bottom:8px; }
    code{ background:var(--pozadi); padding:1px 5px; border-radius:6px; font-size:12px; word-break:break-all; }
    ol{ padding-left:20px; } li{ margin-bottom:8px; }
    .hlavaKarty{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  </style>
</head>
<body>
  <div class="obal">
    <div class="titul">PIVNÍ POČÍTADLO</div>
    <div class="podtitul">administrace</div>
    <div id="app"><div class="karta kour">Načítám…</div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script>
  "use strict";

  /* ===================== KONFIGURACE ===================== */
  const firebaseConfig = {
    apiKey: "AIzaSyC1MjOGG_trg1_5BH6e5NLJZh3Jtvuj_vg",
    authDomain: "pivni-pocitacka.firebaseapp.com",
    databaseURL: "https://pivni-pocitacka-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "pivni-pocitacka",
    storageBucket: "pivni-pocitacka.firebasestorage.app",
    messagingSenderId: "778652678455",
    appId: "1:778652678455:web:5085fffee1ecacc88482b2"
  };
  const ADMIN_EMAILS = ["gabr.kova@gmail.com"];  // UI brána; ostrá brána je v pravidlech DB
  /* ======================================================= */

  const DB = String(firebaseConfig.databaseURL || "").replace(/\/+$/, "");
  const jeNastaveno = !JSON.stringify(firebaseConfig).includes("SEM_VLOZ");

  let auth = null, uzivatel = null, chyba = "", info = "", pracuji = false;
  let aktivniId = null;
  let akce = {};          // { id: {nazev, zalozeno, hraci, _log} }
  let legacy = null;      // {naseParta, archiv} když existují stará data k importu
  let nahledId = null;

  const slug = (s) => (s || "").toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "akce";
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const sklonuj = (n) => (n === 1 ? "pivo" : n >= 2 && n <= 4 ? "piva" : "piv");
  const fmtDatum = (t) => { try { return new Date(t).toLocaleString("cs-CZ"); } catch (e) { return ""; } };
  const jeAdmin = () => uzivatel && ADMIN_EMAILS.indexOf((uzivatel.email || "").toLowerCase()) >= 0;

  function hraciZ(obj) {
    return Object.entries(obj || {})
      .filter(([k]) => k.charAt(0) !== "_")
      .map(([k, v]) => ({ name: String((v && v.name) || k), count: Math.max(0, (v && typeof v.count === "number") ? v.count : 0) }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, "cs"));
  }
  const soucet = (pole) => pole.reduce((s, r) => s + r.count, 0);

  function exportCsv(pole, nazevSouboru) {
    const hlav = "Jméno;Počet piv;Litry";
    const radky = pole.map((p) => '"' + String(p.name).replace(/"/g, '""') + '";' + p.count + ";" + (p.count * 0.5).toString().replace(".", ","));
    const csv = "\uFEFF" + [hlav].concat(radky).join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nazevSouboru; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  async function token() { return await uzivatel.getIdToken(); }
  const napis = (t) => "?auth=" + encodeURIComponent(t);

  /* ---------- načtení ---------- */
  async function nactiVse() {
    const idRaw = await (await fetch(DB + "/pivo/aktivni.json?v=" + Date.now(), { cache: "no-store" })).json();
    aktivniId = (typeof idRaw === "string" && idRaw) ? idRaw : null;
    akce = await (await fetch(DB + "/pivo/akce.json?v=" + Date.now(), { cache: "no-store" })).json() || {};

    // Import starých dat nabízíme jen, když v novém modelu ještě žádná akce není.
    legacy = null;
    if (!akce || Object.keys(akce).length === 0) {
      const np = await (await fetch(DB + "/pivo/nase-parta.json?v=" + Date.now(), { cache: "no-store" })).json();
      const ar = await (await fetch(DB + "/pivo/archiv.json?v=" + Date.now(), { cache: "no-store" })).json();
      const npHraci = np ? hraciZ(np) : [];
      const arPocet = ar ? Object.keys(ar).length : 0;
      if (npHraci.length > 0 || arPocet > 0) legacy = { naseParta: np || null, archiv: ar || null };
    }
  }

  /* ---------- operace ---------- */
  async function zalozAkci() {
    const el = document.getElementById("novy-nazev");
    const nazev = ((el && el.value) || "").trim().slice(0, 60);
    if (!nazev) { chyba = "Zadej název akce."; render(); return; }
    pracuji = true; chyba = ""; info = ""; render();
    try {
      const t = await token();
      const id = slug(nazev) + "-" + Date.now();
      let r = await fetch(DB + "/pivo/akce/" + id + ".json" + napis(t), {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nazev: nazev, zalozeno: Date.now() })
      });
      if (!r.ok) throw new Error("akce " + r.status);
      r = await fetch(DB + "/pivo/aktivni.json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(id) });
      if (!r.ok) throw new Error("aktivni " + r.status);
      info = 'Akce „' + nazev + '" založena a nastavena jako aktuální.';
      await nactiVse();
    } catch (e) { chyba = "Založení se nepovedlo (" + e.message + ")."; }
    pracuji = false; render();
  }

  async function nastavAktualni(id) {
    const naz = (akce[id] && akce[id].nazev) || id;
    if (!window.confirm('Nastavit „' + naz + '" jako aktuální akci?\n\nAplikace všem přepne na tuto akci.')) return;
    pracuji = true; chyba = ""; info = ""; render();
    try {
      const t = await token();
      const r = await fetch(DB + "/pivo/aktivni.json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(id) });
      if (!r.ok) throw new Error("aktivni " + r.status);
      info = 'Aktuální akce je nyní „' + naz + '".';
      await nactiVse();
    } catch (e) { chyba = "Přepnutí se nepovedlo (" + e.message + ")."; }
    pracuji = false; render();
  }

  async function prejmenuj(id) {
    const stary = (akce[id] && akce[id].nazev) || "";
    const novy = window.prompt("Nový název akce:", stary);
    if (novy === null) return;
    const n = novy.trim().slice(0, 60);
    if (!n || n === stary) return;
    pracuji = true; chyba = ""; info = ""; render();
    try {
      const t = await token();
      const r = await fetch(DB + "/pivo/akce/" + id + "/nazev.json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(n) });
      if (!r.ok) throw new Error("nazev " + r.status);
      info = "Akce přejmenována.";
      await nactiVse();
    } catch (e) { chyba = "Přejmenování se nepovedlo (" + e.message + ")."; }
    pracuji = false; render();
  }

  async function importuj() {
    if (!legacy) return;
    if (!window.confirm("Importovat dosavadní data (aktuální tabuli + archiv) do nového modelu?\n\nStará data zůstanou beze změny, jen se zkopírují.")) return;
    pracuji = true; chyba = ""; info = ""; render();
    try {
      const t = await token();
      let aktivniNovy = null;

      // 1) aktuální tabule (nase-parta), pokud má hráče
      const np = legacy.naseParta;
      const npHraci = np ? Object.fromEntries(Object.entries(np).filter(([k]) => k.charAt(0) !== "_")) : {};
      if (Object.keys(npHraci).length > 0) {
        const id = "aktualni-" + Date.now();
        const telo = { nazev: "Aktuální (import)", zalozeno: Date.now(), hraci: npHraci };
        if (np && np._log) telo._log = np._log;
        const r = await fetch(DB + "/pivo/akce/" + id + ".json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(telo) });
        if (!r.ok) throw new Error("aktualni " + r.status);
        aktivniNovy = id;
      }

      // 2) archivované akce
      const ar = legacy.archiv || {};
      for (const aid of Object.keys(ar)) {
        const v = ar[aid] || {};
        const data = v.data || {};
        const hraci = Object.fromEntries(Object.entries(data).filter(([k]) => k.charAt(0) !== "_"));
        const telo = { nazev: v.nazev || aid, zalozeno: v.archivovanoKdy || Date.now(), hraci: hraci };
        if (data._log) telo._log = data._log;
        const novyId = slug(v.nazev || aid) + "-" + (v.archivovanoKdy || Date.now());
        const r = await fetch(DB + "/pivo/akce/" + novyId + ".json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(telo) });
        if (!r.ok) throw new Error("archiv " + r.status);
      }

      // 3) když byla aktuální tabule, nastav ji jako aktivní
      if (aktivniNovy) {
        const r = await fetch(DB + "/pivo/aktivni.json" + napis(t), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(aktivniNovy) });
        if (!r.ok) throw new Error("aktivni " + r.status);
      }
      info = "Import hotový. Zkontroluj názvy akcí a případně je přejmenuj.";
      await nactiVse();
    } catch (e) { chyba = "Import se nepovedl (" + e.message + ")."; }
    pracuji = false; render();
  }

  /* ---------- přihlášení ---------- */
  function prihlasit() {
    chyba = "";
    const p = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch((e) => { chyba = "Přihlášení se nepovedlo: " + e.message; render(); });
  }
  function odhlasit() { nahledId = null; auth.signOut(); }

  /* ---------- UI akce ---------- */
  function otevriNahled(id) { nahledId = id; render(); }
  function zavriNahled() { nahledId = null; render(); }
  function exportAkce(id) {
    const a = akce[id]; if (!a) return;
    exportCsv(hraciZ(a.hraci || {}), "pivo-" + slug(a.nazev || id) + ".csv");
  }
  async function obnovVse() { chyba = ""; info = ""; try { await nactiVse(); } catch (e) { chyba = "Načtení selhalo: " + e.message; } render(); }

  /* ---------- vykreslení ---------- */
  function zebricekHtml(pole) {
    if (!pole.length) return '<div class="male kour" style="text-align:center;padding:10px 0;">Prázdné.</div>';
    return pole.map((r, i) => '<div class="radek"><div class="jmeno-text">' + (i + 1) + ". " + esc(r.name) + '</div><div style="font-weight:700;">' + r.count + "</div></div>").join("");
  }

  function render() {
    const app = document.getElementById("app");
    const pruh = (chyba ? '<div class="chyba">' + esc(chyba) + "</div>" : "") + (info ? '<div class="ok">' + esc(info) + "</div>" : "");

    if (!jeNastaveno) {
      app.innerHTML = '<div class="karta"><div class="nazevKarty">Admin ještě není nastaven 🔧</div>' +
        '<div class="male kour">Do souboru doplň <code>firebaseConfig</code> a nastav Google přihlášení (postup v hlavičce souboru).</div></div>';
      return;
    }
    if (!uzivatel) {
      app.innerHTML = pruh + '<div class="karta" style="text-align:center;">' +
        '<div class="kour male" style="margin-bottom:14px;">Přihlas se svým Google účtem.</div>' +
        '<button class="btn" onclick="prihlasit()">Přihlásit se přes Google</button></div>';
      return;
    }
    if (!jeAdmin()) {
      app.innerHTML = pruh + '<div class="karta" style="text-align:center;">' +
        '<div style="margin-bottom:8px;">Přihlášen: <b>' + esc(uzivatel.email || "") + "</b></div>" +
        '<div style="color:var(--cerv);margin-bottom:14px;" class="male">Tento účet nemá administrátorské oprávnění.</div>' +
        '<button class="btn sek" onclick="odhlasit()">Odhlásit</button></div>';
      return;
    }

    if (nahledId && akce[nahledId]) {
      const a = akce[nahledId];
      const pole = hraciZ(a.hraci || {});
      const c = soucet(pole);
      app.innerHTML = pruh + '<div class="karta"><div class="hlavaKarty"><div class="nazevAkce">' + esc(a.nazev || nahledId) + "</div>" +
        '<button class="btn sek mini" onclick="zavriNahled()">← Zpět</button></div>' +
        '<div class="male kour" style="margin-bottom:8px;">' + pole.length + " lidí · " + c + " " + sklonuj(c) + " · " + (c * 0.5).toLocaleString("cs-CZ") + " l · jen ke čtení</div>" +
        zebricekHtml(pole) +
        '<div class="tlacitka" style="margin-top:12px;"><button class="btn sek mini" onclick="exportAkce(\'' + esc(nahledId) + '\')">⬇ Export (CSV)</button></div></div>';
      return;
    }

    const idy = Object.keys(akce).sort((x, y) => ((akce[y] && akce[y].zalozeno) || 0) - ((akce[x] && akce[x].zalozeno) || 0));

    let html = pruh +
      '<div class="karta"><div class="hlavaKarty"><div class="male">Admin: <b>' + esc(uzivatel.email || "") + "</b></div>" +
        '<button class="btn sek mini" onclick="odhlasit()">Odhlásit</button></div>' +
        '<div class="male kour">Aktuální akce: ' + (aktivniId && akce[aktivniId] ? "<b>" + esc(akce[aktivniId].nazev || aktivniId) + "</b>" : "<i>žádná</i>") + "</div></div>";

    if (legacy) {
      html += '<div class="karta"><div class="nazevKarty">Import dosavadních dat</div>' +
        '<div class="male kour" style="margin-bottom:10px;">Našel jsem data ze starého modelu (aktuální tabule a/nebo archiv). Jednorázově je zkopíruju do nového modelu jako akce. Stará data zůstanou nedotčená.</div>' +
        '<button class="btn" onclick="importuj()"' + (pracuji ? " disabled" : "") + ">" + (pracuji ? "Pracuji…" : "Importovat dosavadní data") + "</button></div>";
    }

    html += '<div class="karta"><div class="nazevKarty">Nová akce</div>' +
      '<div class="male kour" style="margin-bottom:10px;">Založí novou akci a rovnou ji nastaví jako aktuální (dosavadní akce zůstanou v seznamu).</div>' +
      '<input id="novy-nazev" class="pole" maxlength="60" placeholder="Název akce (např. Tatanice 2026)" style="margin-bottom:10px;" />' +
      '<button class="btn" onclick="zalozAkci()"' + (pracuji ? " disabled" : "") + ">" + (pracuji ? "Pracuji…" : "Založit a nastavit jako aktuální") + "</button></div>";

    html += '<div class="karta"><div class="hlavaKarty"><div class="nazevKarty" style="margin:0;">Akce</div>' +
      '<button class="btn sek mini" onclick="obnovVse()">Obnovit</button></div>';
    if (idy.length === 0) {
      html += '<div class="male kour" style="text-align:center;padding:8px 0;">Zatím žádná akce. Založ první výše.</div>';
    } else {
      html += idy.map((id) => {
        const a = akce[id] || {};
        const pole = hraciZ(a.hraci || {});
        const c = soucet(pole);
        const jeAkt = id === aktivniId;
        return '<div class="polozka"><div class="hlava"><div style="min-width:0;">' +
          '<div class="nazevAkce">' + esc(a.nazev || id) + (jeAkt ? '<span class="odznak">AKTUÁLNÍ</span>' : "") + "</div>" +
          '<div class="male kour">' + fmtDatum(a.zalozeno) + " · " + pole.length + " lidí · " + c + " " + sklonuj(c) + "</div></div></div>" +
          '<div class="tlacitka">' +
            (jeAkt ? "" : '<button class="btn mini" onclick="nastavAktualni(\'' + esc(id) + '\')">Nastavit jako aktuální</button>') +
            '<button class="btn sek mini" onclick="otevriNahled(\'' + esc(id) + '\')">Zobrazit</button>' +
            '<button class="btn sek mini" onclick="prejmenuj(\'' + esc(id) + '\')">Přejmenovat</button>' +
            '<button class="btn sek mini" onclick="exportAkce(\'' + esc(id) + '\')">Export</button>' +
          "</div></div>";
      }).join("");
    }
    html += "</div>";

    app.innerHTML = html;
  }

  /* ---------- start ---------- */
  (function start() {
    if (!jeNastaveno) { render(); return; }
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      auth.onAuthStateChanged(async (u) => {
        uzivatel = u; nahledId = null; chyba = "";
        if (u && jeAdmin()) { try { await nactiVse(); } catch (e) { chyba = "Načtení selhalo: " + e.message; } }
        render();
      });
    } catch (e) { chyba = "Firebase se nepodařilo spustit: " + e.message; render(); }
  })();
  </script>
</body>
</html>
