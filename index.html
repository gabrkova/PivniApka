<!DOCTYPE html>
<html lang="cs">
<!--
================================================================
PIVNÍ POČÍTADLO — uživatelská aplikace

Model: aktivní akci určuje ukazatel /pivo/aktivni (spravuje admin).
  /pivo/aktivni            -> id aktivní akce (řetězec)
  /pivo/akce/<id>          -> { nazev, zalozeno, hraci:{...}, _log:{...} }
Aplikace čte aktivní akci a zapisuje piva do ní. Když admin přepne
aktivní akci, aplikace se sama přeladí a počítadlo srovná na server.

Pravidla databáze musí odpovídat tomuto modelu – viz hlavička admin.html.
================================================================
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pivní počítadlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --pozadi:#150e07; --pozadi2:#231508; --karta:#241808; --okraj:#3d2d14;
      --lezak:#f0a71f; --lezak-tmavy:#b97a0c; --mosaz:#6b4a09;
      --pena:#f7efdc; --kour:#a3906f; --cerv:#d0704e;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body{
      margin:0; min-height:100vh; color:var(--pena);
      font-family:'Archivo',system-ui,sans-serif;
      background:radial-gradient(900px 520px at 50% -8%, var(--pozadi2), var(--pozadi) 62%);
      display:flex; justify-content:center; padding:24px 16px;
    }
    .obal{ width:100%; max-width:28rem; }
    .titul{
      font-family:'Alfa Slab One',serif; font-size:30px; color:var(--lezak);
      text-align:center; letter-spacing:1px; text-shadow:0 2px 0 rgba(0,0,0,.45);
    }
    .podtitul{ color:var(--lezak); font-size:15px; text-align:center; margin-top:3px; font-weight:700; }
    .karta{ background:var(--karta); border:1px solid var(--okraj); border-radius:18px; padding:20px; margin-top:14px; }
    .stred{ display:flex; flex-direction:column; align-items:center; }
    .kour{ color:var(--kour); }
    .male{ font-size:13px; }
    input.pole{
      width:100%; border-radius:14px; padding:12px 16px; font-size:17px;
      background:var(--pozadi); border:1px solid var(--okraj); color:var(--pena);
    }
    input.pole:focus{ outline:none; border-color:var(--lezak); }
    button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
    button:active{ transform:scale(.96); }
    .hlavni{
      width:100%; margin-top:12px; border-radius:14px; padding:13px; font-weight:700; font-size:17px;
      color:#241503; background:linear-gradient(180deg, var(--lezak), var(--lezak-tmavy)); border:2px solid var(--mosaz);
    }
    .hlavni:disabled{ opacity:.4; }
    .pipa{
      width:158px; height:158px; border-radius:999px; margin-top:2px;
      background:radial-gradient(circle at 32% 26%, #ffd97e, var(--lezak) 46%, var(--lezak-tmavy));
      border:5px solid var(--mosaz); color:#241503;
      box-shadow:0 12px 26px rgba(0,0,0,.55), inset 0 -10px 18px rgba(0,0,0,.28), inset 0 6px 10px rgba(255,255,255,.25);
      display:flex; flex-direction:column; align-items:center; justify-content:center; user-select:none;
    }
    .pipa .emoji{ font-size:42px; line-height:1; }
    .pipa .napis{ font-family:'Alfa Slab One',serif; font-size:24px; margin-top:2px; }
    .pipa-obsah{ display:flex; align-items:center; gap:6px; }
    .pipa-obsah .plus1{ font-family:'Alfa Slab One',serif; font-size:44px; line-height:1; }
    .pipa-obsah .pivo-ikona{ font-size:56px; line-height:1; }
    .cislo{ font-family:'Alfa Slab One',serif; font-size:56px; line-height:1.1; }
    .cislo-des{ font-size:0.25em; opacity:.6; }
    .pocet-text{ font-size:24px; font-weight:700; margin:2px 0 14px; text-align:center; line-height:1.3; }
    .poc-cislo{ color:var(--lezak); }
    .poc-slovo{ font-size:0.7em; color:var(--kour); font-weight:600; }
    .oprava{ margin-top:14px; border:1px solid var(--okraj); color:var(--kour); border-radius:999px; padding:8px 16px; font-size:13px; }
    .oprava:disabled{ opacity:.3; }
    .radek-souhrn{ display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
    .obnov{ border:1px solid var(--okraj); color:var(--kour); border-radius:999px; padding:5px 12px; font-size:12px; }
    .zaznam{ margin-bottom:12px; }
    .zaznam .horni{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .zaznam .jm{ display:flex; align-items:center; gap:8px; min-width:0; }
    .zaznam .jmeno-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ja{ color:var(--lezak); font-weight:700; }
    .prouzek{ height:7px; border-radius:999px; background:var(--pozadi); margin:5px 0 0 26px; }
    .prouzek > div{ height:7px; border-radius:999px; background:linear-gradient(90deg, var(--lezak-tmavy), var(--lezak)); transition:width .3s; }
    .den-radek{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; font-size:13px; border-top:1px solid rgba(255,255,255,.06); }
    .den-radek:first-of-type{ border-top:none; }
    .den-radek .kdo{ display:flex; align-items:center; gap:7px; min-width:0; }
    .den-radek .kdo span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .den-radek .prawo{ white-space:nowrap; }
    .plus{ color:var(--lezak); font-weight:700; }
    .minus{ color:var(--cerv); font-weight:700; }
    .chyba{
      background:#31170e; color:var(--cerv); border:1px solid var(--cerv);
      border-radius:14px; padding:8px 12px; font-size:13px; text-align:center; margin-top:12px;
    }
    .paticka{ color:var(--kour); font-size:12px; text-align:center; margin-top:16px; }
    .paticka button{ text-decoration:underline; color:var(--kour); font-size:12px; }
    .paticka .ano{ color:var(--lezak); font-weight:700; text-decoration:none; }
    .paticka .ne{ color:var(--kour); font-weight:700; text-decoration:none; }
    ol{ padding-left:20px; margin:8px 0; } li{ margin-bottom:8px; }
    code{ background:var(--pozadi); padding:1px 5px; border-radius:6px; font-size:12px; word-break:break-all; }
    .tacek-band{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; }
    .info-vlevo{ flex:1 1 0; min-width:0; font-size:12px; color:var(--kour); display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
    .tacek-stred{ flex:none; display:flex; flex-direction:column; align-items:center; }
    .vyber-vpravo{ flex:1 1 0; display:flex; flex-direction:column; gap:9px; align-items:flex-end; }
    .pill{ border-radius:999px; padding:10px 16px; font-size:16px; font-weight:700; background:var(--pozadi); border:1px solid var(--okraj); color:var(--kour); cursor:pointer; white-space:nowrap; }
    .pill.akt{ background:linear-gradient(180deg, var(--lezak), var(--lezak-tmavy)); color:#241503; border-color:var(--mosaz); }
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
      button:active{ transform:none; }
    }
  </style>
</head>
<body>
  <div class="obal">
    <div class="titul">PIVNÍ POČÍTADLO</div>
    <div class="podtitul" id="podtitul">&nbsp;</div>
    <div id="app"></div>
  </div>

<script>
"use strict";

/* ========================= NASTAVENÍ ========================= */
const DB_URL = "https://pivni-pocitacka-default-rtdb.europe-west1.firebasedatabase.app";
const LOG_ZOBRAZIT = 25;
/* ============================================================= */

const zaklad = String(DB_URL).replace(/\/+$/, "");
const nastaveno = /^https:\/\//.test(zaklad) && !zaklad.includes("SEM-VLOZ");

let faze = "start";        // setup | zadnaAkce | jmeno | hraje
let akceId = null;
let akceNazev = "";
let odemceno = true;       // false = akce je uzamčená (jen ke čtení)
let velikosti = ["0.5"];   // povolené velikosti piv v aktivní akci
let jmeno = "";
let mujPocet = 0;          // moje piva celkem (kusů, součet přes velikosti)
let mujPocty = {};         // moje piva po velikostech: { "0.5": n, ... }
let vybranaVelikost = null; // aktuálně vybraná velikost pro tácek (klik = +1 této velikosti)
let radky = {};            // hraci aktivní akce: { slug: {name, count, updatedAt} }
let logData = {};          // _log aktivní akce
let chyba = "";
let cas = null;
let obnovuji = false;
let prejmenovani = false;
let ukladam = false, ceka = false;

/* ---------- pomocné funkce ---------- */
const slug = (s) => (s || "").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_")
  .replace(/^_+|_+$/g, "") || "anonym";
const sklonuj = (n) => (n === 1 ? "pivo" : n >= 2 && n <= 4 ? "piva" : "piv");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtCas = (t) => {
  try { return new Date(t).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }); }
  catch (e) { return ""; }
};

const urlAktivni = () => zaklad + "/pivo/aktivni.json";
const urlAkce = (cesta) => zaklad + "/pivo/akce/" + akceId + cesta + ".json";

/* ---------- velikosti piv a počty ---------- */
const VELIKOSTI_VSE = ["0.5", "0.3"];
const VEL_NAZEV = { "0.5": "velké", "0.3": "malé" };
const velLabel = (kod) => VEL_NAZEV[kod] || (String(kod).replace(".", ",") + " l");
const fmtL = (n) => (Math.round(n * 100) / 100).toLocaleString("cs-CZ");
function velikostiZ(node) {
  let v = node && node.velikosti, arr = [];
  if (Array.isArray(v)) arr = v.map(String);
  else if (v && typeof v === "object") arr = Object.values(v).map(String);
  arr = VELIKOSTI_VSE.filter((k) => arr.indexOf(k) >= 0);
  return arr.length ? arr : ["0.5"];
}
function poctyZ(rec) {
  const p = {};
  if (rec && rec.pocty && typeof rec.pocty === "object") {
    for (const k in rec.pocty) { const n = rec.pocty[k]; if (typeof n === "number" && n > 0) p[String(k).replace(/_/g, ".")] = n; }
  } else if (rec && typeof rec.count === "number" && rec.count > 0) {
    p["0.5"] = rec.count;
  }
  return p;
}
const encPocty = (p) => { const o = {}; for (const k in (p || {})) o[String(k).replace(/\./g, "_")] = p[k]; return o; };
const celkemKusu = (p) => Object.keys(p || {}).reduce((s, k) => s + (p[k] || 0), 0);
const litryZ = (p) => Object.keys(p || {}).reduce((s, k) => s + parseFloat(k) * (p[k] || 0), 0);
const pivaZ = (p) => litryZ(p) / 0.5;   // 1 pivo = 0,5 l (spravedlivé skóre napříč velikostmi)
const pivaLabel = (x) => (Number.isInteger(x) ? sklonuj(x) : "piva");
function cisloHtml(x) {
  const s = fmtL(x);
  const i = s.indexOf(",");
  return (i < 0) ? s : s.slice(0, i) + '<span class="cislo-des">' + s.slice(i) + "</span>";
}
function pocetText(pocty) {
  const casti = velikosti.filter((s) => (pocty[s] || 0) > 0).map((s) => {
    const n = pocty[s];
    let nazev;
    if (s === "0.5") nazev = (n >= 5 ? "velkých" : "velké");
    else if (s === "0.3") nazev = (n >= 5 ? "malých" : "malé");
    else nazev = velLabel(s);
    return '<span class="poc-cislo">' + n + '</span> <span class="poc-slovo">' + nazev + "</span>";
  });
  return casti.length ? casti.join(' <span class="poc-slovo">a</span> ') : '<span class="poc-slovo">0 piv</span>';
}
function pocetZkratka(pocty) {
  const casti = velikosti.filter((s) => (pocty[s] || 0) > 0).map((s) => {
    if (s === "0.5") return String(pocty[s]);
    if (s === "0.3") return pocty[s] + "m";
    return pocty[s] + " " + velLabel(s);
  });
  return casti.length ? casti.join(" + ") : "0";
}

function jmenoLokalne(n) {
  try {
    if (n === null) localStorage.removeItem("pivo_jmeno");
    else if (n !== undefined) localStorage.setItem("pivo_jmeno", n);
    return localStorage.getItem("pivo_jmeno") || "";
  } catch (e) { return ""; }
}

function velikostLokalne(n) {
  try {
    if (n !== undefined) localStorage.setItem("pivo_velikost", n);
    return localStorage.getItem("pivo_velikost") || "";
  } catch (e) { return ""; }
}

/* ---------- načtení dat ---------- */
async function nacti(tiche) {
  if (!nastaveno) return;
  if (!tiche) { obnovuji = true; render(); }
  try {
    const idRaw = await (await fetch(urlAktivni() + "?v=" + Date.now(), { cache: "no-store" })).json();
    const id = (typeof idRaw === "string" && idRaw) ? idRaw : null;

    if (!id) {
      akceId = null; akceNazev = ""; radky = {}; logData = {};
      faze = "zadnaAkce"; cas = new Date(); chyba = "";
    } else {
      let posledni = ""; try { posledni = localStorage.getItem("pivo_akce") || ""; } catch (e) {}
      const novaAkce = id !== posledni;
      if (novaAkce) { try { localStorage.setItem("pivo_akce", id); } catch (e) {} }
      akceId = id;

      const node = await (await fetch(urlAkce("") + "?v=" + Date.now(), { cache: "no-store" })).json() || {};
      akceNazev = (node && node.nazev) ? String(node.nazev) : "Aktuální akce";
      odemceno = !(node && node.odemcena === false);
      velikosti = velikostiZ(node);
      const ulozV = velikostLokalne();
      vybranaVelikost = (velikosti.indexOf(ulozV) >= 0) ? ulozV : velikosti[0];
      radky = (node && typeof node.hraci === "object" && node.hraci) ? node.hraci : {};
      logData = (node && typeof node._log === "object" && node._log) ? node._log : {};

      if (jmeno) {
        const muj = radky[slug(jmeno)];
        if (novaAkce || (!ukladam && !ceka)) mujPocty = poctyZ(muj);
        mujPocet = celkemKusu(mujPocty);
        faze = "hraje";
      } else {
        faze = "jmeno";
      }
      cas = new Date(); chyba = "";
    }
  } catch (e) {
    chyba = "Nejde načíst data — zkontroluj připojení.";
  }
  obnovuji = false;
  render();
}

async function uloz() {
  if (!akceId) return;
  if (ukladam) { ceka = true; return; }
  ukladam = true;
  try {
    const r = await fetch(urlAkce("/hraci/" + slug(jmeno)), {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: jmeno, count: celkemKusu(mujPocty), pocty: encPocty(mujPocty), updatedAt: Date.now() })
    });
    if (!r.ok) throw new Error(r.status);
    chyba = "";
  } catch (e) {
    chyba = "Uložení se nepovedlo — zkus to za chvíli.";
    if (faze === "hraje") render();
  }
  ukladam = false;
  if (ceka) { ceka = false; uloz(); }
  else nacti(true);
}

async function zapisLog(delta, size) {
  if (!akceId) return;
  try {
    await fetch(urlAkce("/_log"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: jmeno, delta: delta, size: size, count: mujPocet, t: Date.now() })
    });
    nacti(true);
  } catch (e) { /* log není kritický */ }
}

/* ---------- akce z UI ---------- */
function pridej(size) {
  if (!odemceno || velikosti.indexOf(size) < 0) return;
  mujPocty[size] = (mujPocty[size] || 0) + 1;
  mujPocet = celkemKusu(mujPocty);
  render(); uloz(); zapisLog(1, size);
}
function uber(size) {
  if (!odemceno || !(mujPocty[size] > 0)) return;
  mujPocty[size] = mujPocty[size] - 1;
  if (mujPocty[size] <= 0) delete mujPocty[size];
  mujPocet = celkemKusu(mujPocty);
  render(); uloz(); zapisLog(-1, size);
}

function vyberVelikost(size) {
  if (velikosti.indexOf(size) < 0) return;
  vybranaVelikost = size;
  velikostLokalne(size);
  render();
}

async function prihlas() {
  const el = document.getElementById("vstup");
  const n = ((el && el.value) || "").trim().slice(0, 24);
  if (!n || !akceId) return;
  jmeno = n; jmenoLokalne(n); faze = "hraje"; mujPocty = {}; mujPocet = 0; render();
  try {
    const r = await fetch(urlAkce("/hraci/" + slug(n)));
    if (r.ok) { const d = await r.json(); mujPocty = poctyZ(d); mujPocet = celkemKusu(mujPocty); }
  } catch (e) {}
  if (odemceno) { if (mujPocet === 0) uloz(); else render(); }
  else render();
  nacti(true);
}

/* (ii) přihlásit se jako někdo jiný */
function prihlasitJako() {
  jmenoLokalne(null);
  jmeno = ""; prejmenovani = false;
  faze = akceId ? "jmeno" : "zadnaAkce";
  render();
}

/* (i) přejmenovat sebe – počet piv zůstává */
function zacniPrejmenovat() { prejmenovani = true; render(); }
function zrusPrejmenovat() { prejmenovani = false; render(); }
async function ulozNoveJmeno() {
  const el = document.getElementById("nove-jmeno");
  const nove = ((el && el.value) || "").trim().slice(0, 24);
  if (!nove || nove === jmeno || !akceId) { prejmenovani = false; render(); return; }
  const staryS = slug(jmeno), novyS = slug(nove);
  let poctyNove = Object.assign({}, mujPocty);
  try {
    if (novyS !== staryS) {
      const r = await fetch(urlAkce("/hraci/" + novyS));
      if (r.ok) { const d = await r.json(); const cizi = poctyZ(d); for (const k in cizi) poctyNove[k] = (poctyNove[k] || 0) + cizi[k]; }
    }
    const celk = celkemKusu(poctyNove);
    await fetch(urlAkce("/hraci/" + novyS), {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: nove, count: celk, pocty: encPocty(poctyNove), updatedAt: Date.now() })
    });
    if (novyS !== staryS) { try { await fetch(urlAkce("/hraci/" + staryS), { method: "DELETE" }); } catch (e) {} }
    jmeno = nove; jmenoLokalne(nove); mujPocty = poctyNove; mujPocet = celk; chyba = "";
  } catch (e) {
    chyba = "Přejmenování se nepovedlo — zkus to za chvíli.";
  }
  prejmenovani = false; render(); nacti(true);
}

/* (iii) export žebříčku do CSV (rozpad po velikostech) */
function exportCsv() {
  const vel = velikosti.slice();
  const lidi = Object.entries(radky || {})
    .filter(([s]) => s.charAt(0) !== "_")
    .map(([s, d]) => ({ slug: s, name: String((d && d.name) || s), pocty: poctyZ(d) }));
  if (jmeno && faze === "hraje") {
    const s = slug(jmeno);
    const i = lidi.findIndex((x) => x.slug === s);
    if (i >= 0) { lidi[i].name = jmeno; lidi[i].pocty = mujPocty; }
    else lidi.push({ slug: s, name: jmeno, pocty: mujPocty });
  }
  lidi.sort((a, b) => pivaZ(b.pocty) - pivaZ(a.pocty) || a.name.localeCompare(b.name, "cs"));
  const hlav = ["Jméno"].concat(vel.map(velLabel)).concat(["Piva (0,5 l)", "Litry"]).join(";");
  const radkyCsv = lidi.map((p) => {
    const cols = ['"' + String(p.name).replace(/"/g, '""') + '"']
      .concat(vel.map((s) => String(p.pocty[s] || 0)))
      .concat([pivaZ(p.pocty).toString().replace(".", ","), litryZ(p.pocty).toString().replace(".", ",")]);
    return cols.join(";");
  });
  const csv = "\uFEFF" + [hlav].concat(radkyCsv).join("\r\n");
  try {
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const zn = (akceNazev ? slug(akceNazev) : "zebricek");
    a.href = url; a.download = "pivo-" + zn + ".csv";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  } catch (e) { chyba = "Export se nepovedl v tomto prohlížeči."; render(); }
}

function obnov() { nacti(false); }

/* ---------- sestavení žebříčku ---------- */
function seznam() {
  const pole = Object.entries(radky || {})
    .filter(([s]) => s.charAt(0) !== "_")
    .map(([s, d]) => {
      const p = poctyZ(d);
      return { slug: s, name: String((d && d.name) || s), piva: pivaZ(p), litry: litryZ(p), pocty: p, kdy: (d && d.updatedAt) || null };
    });
  if (jmeno && faze === "hraje") {
    const s = slug(jmeno);
    const i = pole.findIndex((p) => p.slug === s);
    if (i >= 0) { pole[i].name = jmeno; pole[i].piva = pivaZ(mujPocty); pole[i].litry = litryZ(mujPocty); pole[i].pocty = mujPocty; }
    else pole.push({ slug: s, name: jmeno, piva: pivaZ(mujPocty), litry: litryZ(mujPocty), pocty: mujPocty, kdy: null });
  }
  pole.sort((a, b) => b.piva - a.piva || a.name.localeCompare(b.name, "cs"));
  return pole;
}

function deni() {
  return Object.values(logData || {})
    .filter((e) => e && typeof e.t === "number")
    .sort((a, b) => b.t - a.t)
    .slice(0, LOG_ZOBRAZIT);
}

/* ---------- vykreslení ---------- */
function render() {
  const app = document.getElementById("app");
  const pod = document.getElementById("podtitul");
  pod.textContent = ((faze === "hraje" || faze === "jmeno") && akceNazev) ? akceNazev : "\u00a0";

  const pruhChyby = chyba ? '<div class="chyba">' + esc(chyba) + "</div>" : "";

  if (faze === "setup") {
    app.innerHTML = pruhChyby +
      '<div class="karta"><div style="font-weight:700;font-size:18px;">Chybí adresa databáze 🔧</div>' +
      '<div class="male kour" style="margin-top:6px;">V souboru doplň <code>const DB_URL</code>.</div></div>';
    return;
  }

  if (faze === "start") {
    app.innerHTML = '<div class="karta kour" style="text-align:center;">Načítám…</div>';
    return;
  }

  if (faze === "zadnaAkce") {
    app.innerHTML = pruhChyby +
      '<div class="karta stred" style="text-align:center;">' +
      '<div style="font-size:40px;">🍺</div>' +
      '<div style="font-weight:700;font-size:18px;margin-top:6px;">Zatím žádná aktivní akce</div>' +
      '<div class="male kour" style="margin-top:6px;">Počkej, až ji admin založí. Pak stačí stránku obnovit.</div>' +
      '<button class="obnov" style="margin-top:14px;" onclick="obnov()">' + (obnovuji ? "Obnovuji…" : "Zkusit znovu") + "</button>" +
      "</div>";
    return;
  }

  if (faze === "jmeno") {
    app.innerHTML = pruhChyby +
      '<div class="karta">' +
        '<div style="font-weight:700;font-size:18px;margin-bottom:4px;">Jak ti říkají?</div>' +
        '<div class="male kour" style="margin-bottom:14px;">Napiš svoje jméno (nebo jméno člověka, za kterého zapisuješ). Stejné jméno = stejný účet, jiné jméno = nový účet. Tenhle telefon si jméno zapamatuje.</div>' +
        '<input id="vstup" class="pole" maxlength="24" placeholder="např. Franta" onkeydown="if(event.key===\'Enter\')prihlas()" />' +
        '<button class="hlavni" onclick="prihlas()">Jdu pít 🍺</button>' +
      "</div>";
    const el = document.getElementById("vstup"); if (el) el.focus();
    return;
  }

  /* faze === "hraje" */
  const pole = seznam();
  const celkemPiva = pole.reduce((s, r) => s + r.piva, 0);
  const celkemLitru = pole.reduce((s, r) => s + r.litry, 0);
  const max = Math.max(0.5, ...pole.map((p) => p.piva));
  const mujSlug = slug(jmeno);

  const zebricek = pole.length === 0
    ? '<div class="male kour" style="text-align:center;padding:14px 0;">Zatím nikdo nepije. Buď první! 🍺</div>'
    : pole.map((r, i) => {
        const ja = r.slug === mujSlug;
        const znak = (i + 1) + ".";
        const kdy = (r.kdy && r.piva > 0) ? '<span class="male kour">' + fmtCas(r.kdy) + "</span>" : "";
        return '<div class="zaznam"><div class="horni">' +
          '<div class="jm"><span style="width:26px;display:inline-block;">' + znak + "</span>" +
          '<span class="jmeno-text' + (ja ? " ja" : "") + '">' + esc(r.name) + (ja ? " (já)" : "") + "</span>" + kdy + "</div>" +
          '<div style="font-weight:700;white-space:nowrap;">' + pocetZkratka(r.pocty) + "</div></div>" +
          '<div class="prouzek"><div style="width:' + (r.piva / max * 100) + '%;"></div></div></div>';
      }).join("");

  const udalosti = deni();
  const denicko = udalosti.length === 0
    ? '<div class="male kour" style="text-align:center;padding:10px 0;">Zatím žádné dění.</div>'
    : udalosti.map((e) => {
        const kladne = (e.delta || 0) >= 0;
        const ikona = kladne ? "🍺" : "↩︎";
        const znamenko = kladne ? '<span class="plus">+1</span>' : '<span class="minus">−1</span>';
        const velTxt = e.size ? " · " + velLabel(String(e.size)) : "";
        return '<div class="den-radek"><div class="kdo">' + ikona + '<span>' + esc(e.name || "?") + "</span></div>" +
          '<div class="prawo kour">' + znamenko + velTxt + " · " + fmtCas(e.t) + "</div></div>";
      }).join("");

  const zamek = !odemceno;
  const pivaMoje = pivaZ(mujPocty);
  const vel = (vybranaVelikost && velikosti.indexOf(vybranaVelikost) >= 0) ? vybranaVelikost : velikosti[0];
  const bannerZamek = zamek
    ? '<div class="karta" style="text-align:center;background:#2a2410;border-color:var(--mosaz);color:var(--lezak);font-weight:700;padding:12px;">🔒 Akce je uzamčená — jen ke čtení</div>'
    : "";
  const infoVlevo = "";
  const partaPocty = (function () {
    const t = {};
    Object.entries(radky || {}).filter(([s]) => s.charAt(0) !== "_").forEach(([s, d]) => {
      if (jmeno && faze === "hraje" && s === slug(jmeno)) return;
      const p = poctyZ(d);
      for (const k in p) t[k] = (t[k] || 0) + p[k];
    });
    if (jmeno && faze === "hraje") { for (const k in mujPocty) t[k] = (t[k] || 0) + mujPocty[k]; }
    return t;
  })();
  const pocetHtml = pocetText(mujPocty);
  const vyberHtml = (velikosti.length > 1 && !zamek)
    ? velikosti.map((s) => '<button class="pill' + (s === vel ? " akt" : "") + '" onclick="vyberVelikost(\'' + s + '\')">' + velLabel(s) + "</button>").join("")
    : "";
  const tacekHtml = zamek
    ? '<div class="pipa" style="opacity:.4;filter:grayscale(.4);cursor:default;"><span class="emoji">🔒</span><span class="napis" style="font-size:16px;">ZAMČENO</span></div>'
    : '<button class="pipa" onclick="pridej(\'' + vel + '\')"><span class="pipa-obsah"><span class="plus1">+1</span><span class="pivo-ikona">🍺</span></span></button>';
  const opravaHtml = zamek ? "" : ('<button class="oprava" onclick="uber(\'' + vel + '\')"' + ((mujPocty[vel] || 0) <= 0 ? " disabled" : "") + ">&minus; 1 (překlep)</button>");

  app.innerHTML = pruhChyby + bannerZamek +
    '<div class="karta stred">' +
      '<div style="font-weight:700;font-size:27px;margin-top:2px;">' + esc(jmeno) + "</div>" +
      '<div class="pocet-text">' + pocetHtml + "</div>" +
      '<div class="tacek-band">' +
        '<div class="info-vlevo">' + infoVlevo + "</div>" +
        '<div class="tacek-stred">' + tacekHtml + opravaHtml + "</div>" +
        '<div class="vyber-vpravo">' + vyberHtml + "</div>" +
      "</div>" +
    "</div>" +

    '<div class="karta radek-souhrn" style="padding-top:12px;padding-bottom:12px;">' +
      '<div><div class="male kour" style="font-size:11px;">Parta celkem</div>' +
      '<div style="font-weight:700;font-size:17px;">' + pocetText(partaPocty) + "</div></div>" +
      '<div style="text-align:right;"><div class="male kour" style="font-size:11px;">litrů celkem</div>' +
      '<div style="font-weight:700;font-size:18px;color:var(--lezak);">' + fmtL(celkemLitru) + " l</div></div>" +
    "</div>" +

    '<div class="karta">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
        '<div style="font-weight:700;">Žebříček</div>' +
        '<button class="obnov" onclick="obnov()">' + (obnovuji ? "Obnovuji…" : "Obnovit") + "</button>" +
      "</div>" + zebricek +
    "</div>" +

    '<div class="karta">' +
      '<div style="font-weight:700;margin-bottom:6px;">Kdo, kdy, co</div>' + denicko +
    "</div>" +

    '<div class="paticka">' +
      (cas ? "<div>Naposledy obnoveno " + cas.toLocaleTimeString("cs-CZ") + ", obnovuje se každých 15 s.</div>" : "") +
      '<div style="margin-top:4px;">Žebříček i dění vidí všichni, kdo mají odkaz.</div>' +
      '<div style="margin-top:12px;"><button class="obnov" onclick="exportCsv()">⬇ Export žebříčku (CSV)</button></div>' +
      (zamek
        ? '<div style="margin-top:14px;"><button onclick="prihlasitJako()">Přihlásit se jako někdo jiný</button></div>'
        : (prejmenovani
          ? '<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;">' +
              '<input id="nove-jmeno" class="pole" style="max-width:190px;padding:8px 12px;font-size:15px;" maxlength="24" value="' + esc(jmeno) + '" onkeydown="if(event.key===\'Enter\')ulozNoveJmeno()" />' +
              '<button class="ano" onclick="ulozNoveJmeno()">Uložit</button>' +
              '<button class="ne" onclick="zrusPrejmenovat()">Zrušit</button></div>' +
            '<div class="male kour" style="margin-top:6px;">Změní tvé jméno a počet piv ti zůstane.</div>'
          : '<div style="margin-top:14px;line-height:2.1;">' +
              '<button onclick="zacniPrejmenovat()">Přejmenovat se</button>' +
              "&nbsp;&nbsp;·&nbsp;&nbsp;" +
              '<button onclick="prihlasitJako()">Přihlásit se jako někdo jiný</button></div>')) +
      '<div style="margin-top:12px;opacity:.7;">Pijte s rozumem. 🍻</div>' +
    "</div>";

  if (prejmenovani) { const nj = document.getElementById("nove-jmeno"); if (nj) { nj.focus(); nj.select(); } }
}

/* ---------- start a samočinná obnova ---------- */
(function start() {
  if (!nastaveno) { faze = "setup"; render(); return; }
  jmeno = jmenoLokalne();
  render();
  nacti(true);
})();

setInterval(() => { if (faze === "hraje" && !prejmenovani) nacti(true); }, 15000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && (faze === "hraje" || faze === "zadnaAkce")) nacti(true);
});
</script>
</body>
</html>
